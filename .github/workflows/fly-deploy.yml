name: Fly.io Deploy

on:
  push:
    branches:
      - main  
  workflow_dispatch: 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4 # Recommended to use the latest version

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Recommended to use the latest version

      # 3️⃣ Set up Fly CLI
      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1 # This action is fine

      # 4️⃣ Deploy to Fly.io
      - name: Build & Deploy to Fly.io
        run: |
          flyctl deploy \
            --remote-only \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}