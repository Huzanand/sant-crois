name: Fly.io Deploy

on:
  push:
    branches:
      - main  # deploy when pushing to main
  workflow_dispatch: # allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # ⚠️ Set the FLY_API_TOKEN as an environment variable for the entire job
    # This is the correct way for 'flyctl' to automatically authenticate
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4 # Recommended to use the latest version

      # 2️⃣ Set up Docker Buildx (Optional for standard fly deploy, but harmless)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Recommended to use the latest version

      # 3️⃣ Set up Fly CLI
      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1 # This action is fine

      # 4️⃣ ❌ REMOVED: The manual 'flyctl auth token' step is not needed.

      # 5️⃣ Deploy to Fly.io
      - name: Build & Deploy to Fly.io
        # The FLY_API_TOKEN should be set at the job level (as recommended earlier)
        # env:
        #   FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }} # (This line is moved to the job level)
        run: |
          flyctl deploy \
            --remote-only \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}