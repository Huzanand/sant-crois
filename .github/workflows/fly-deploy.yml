name: Fly.io Deploy

on:
  push:
    branches:
      - main  # deploy when pushing to main
  workflow_dispatch: # allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker (GitHub Actions already has it, but explicit setup is good)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Set up Fly CLI
      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      # 4️⃣ Authenticate Fly.io
      - name: Authenticate Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth token $FLY_API_TOKEN

      # 5️⃣ Deploy locally built image to Fly.io
      - name: Build & Deploy to Fly.io
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: flyctl deploy --local-only --image nextapp
